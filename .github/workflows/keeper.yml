# Daily harvest of the Hamstr vaults on Base.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   BASE_RPC_URL        RPC endpoint for Base mainnet (e.g. from Alchemy/QuickNode; the public one is rate-limited)
#   KEEPER_PRIVATE_KEY  key of the keeper wallet. It only holds KEEPER_ROLE: it can call harvest(),
#                       nothing else. Fund it with ~0.005 ETH on Base for gas.
#
# Until contracts/deployments/8453.json exists (mainnet deployment) the job just logs and exits.
# A failed run (stale oracle, deficit, missing role, low balance errors) shows up as a failed
# workflow and GitHub emails the repo owner.
name: Keeper

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check, do not send transactions"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: keeper/package-lock.json

      - name: Install
        working-directory: keeper
        run: npm ci

      - name: Harvest
        env:
          RPC_URL: ${{ secrets.BASE_RPC_URL }}
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          DEPLOYMENT: contracts/deployments/8453.json
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node keeper/src/keeper.mjs
